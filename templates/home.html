<!DOCTYPE html>
<html>
<head>
    <title>MyBank - Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6ff;
        }

        .navbar {
            background: #123c7a;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            color: #123c7a;
            font-size: 45px;
        }

        .hero p {
            font-size: 20px;
            color: #555;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            margin: 10px;
            background: #123c7a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .register {
            background: #198754;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>MyBank</h2>

    <div>
        <a href="/login/">Login</a>
        <a href="/register/">Register</a>
    </div>
</div>

<div class="hero">

    <h1>Welcome to MyBank</h1>

    <p>Simple, Secure and Easy Banking</p>

    <a class="button" href="/login/">Login</a>

    <a class="button register" href="/register/">Create Account</a>

</div>

</body>
</html>
