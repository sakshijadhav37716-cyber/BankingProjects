<!DOCTYPE html>
<html>
<head>
    <title>BankEase - Deposit Money</title>
</head>

<body>

    <h1>💰 Deposit Money</h1>

    <p>Enter the amount you want to deposit into your bank account.</p>

    <form method="POST">

        {% csrf_token %}

        <label>Enter Amount (₹):</label>
        <br>

        <input
            type="number"
            name="amount"
            step="0.01"
            min="1"
            required
        >

        <br><br>

        <button type="submit">Deposit Money</button>

    </form>

    <br>

    <a href="/dashboard/">⬅ Back to Dashboard</a>

</body>
</html>
